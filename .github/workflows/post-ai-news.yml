name: 🤖 LinkedIn AI News Auto-Poster (100% FREE)

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC daily
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  post-ai-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install requests python-dotenv

      - name: 🌐 Fetch Top 10 AI News
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python fetch_news.py

      - name: 🤖 Generate Post (Gemini Free)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_post.py

      - name: 🖼 Generate Image (Free SVG)
        run: python generate_image.py

      - name: 📤 Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: python post_linkedin.py

      - name: ✅ Done
        run: echo "✅ Posted at $(date '+%Y-%m-%d %H:%M UTC')"
